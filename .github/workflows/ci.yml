name: CI

# I04 (docs/improvements/qa-agent-improvement-backlog.md): reproduce the
# verified local checks (`python -m pytest -q`, `python -m pip check`) on
# push/PR to any branch. I05 (ADR-003: docs/adr/ADR-003-quality-tooling.md)
# adds the ADR-approved quality-tooling steps (Ruff lint, coverage report,
# pip-audit) as a separate job so a tooling failure is distinguishable from a
# test failure. No coverage threshold or job beyond what was verified locally
# is introduced (Constitution XII).

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python versions justified by pyproject.toml's
        # `requires-python = ">=3.11"`: the floor (3.11) and the next minor
        # (3.12). No version is invented beyond what that floor implies.
        python-version: ["3.11", "3.12"]
        # OS matrix added by T204 (specs/002-production-readiness).
        # Rationale: the 2026-08-21 audit found two defects that were invisible
        # on Windows-only verification — a hardcoded `python` interpreter that
        # does not exist on macOS, and a path separator rewrite that only
        # resolved on Windows. Single-platform CI cannot catch that class of
        # bug, so all three platforms run the suite (FR-104 / SC-101).
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Check dependency consistency
        run: python -m pip check

  quality:
    name: Quality tooling (ADR-003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Static type check (T228, scoped — see [tool.mypy] in pyproject.toml)
        run: python -m mypy

      - name: Coverage report (informational, no threshold gate)
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report

      - name: Dependency vulnerability audit
        run: python -m pip_audit
